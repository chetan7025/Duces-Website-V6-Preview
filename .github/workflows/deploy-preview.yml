name: Deploy DUCES V6 review preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-preview
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out DUCES V6 review branch
        uses: actions/checkout@v4
        with:
          repository: chetan7025/Duces-Website-V6
          ref: v6-review-improvements
          path: site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Keep static HTML files as-is
        run: touch site/.nojekyll

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4

# Trigger a clean deployment with a fresh Pages artifact.
